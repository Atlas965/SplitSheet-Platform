name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run vitest suite (split math, hash chain, fraud scoring)
        run: npm run test

      - name: Marketing-claim guardrail (Priority 1.4)
        run: npm run lint:marketing-claims

      - name: Schema drift check (Priority 4.2)
        run: npm run db:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Non-blocking: reports pre-existing type issues without failing the
      # pipeline. Flip to a hard failure once the known frontend debt
      # (tracked in README §17 Launch Readiness) is cleared.
      - name: Run tsc --noEmit
        run: npm run check
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build client + server bundles
        run: npm run build
        env:
          NODE_ENV: production
